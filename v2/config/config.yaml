  base_url: ''
  app_key: ''
  app_secret: ''
  account_no: ''
  custtype: 'P'
  tr_id: 'H0STCNT0'
websocket:
  url: 'ws://ops.koreainvestment.com:21000/ws'
  ping_interval: 25
  reconnect_min_delay: 5
  reconnect_max_delay: 300
