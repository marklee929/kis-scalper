# 전략 및 필터 설정 (예시값)
# 실제 환경에 맞춰 수정하세요.

market_data:
  provider: "yfinance"
  max_retries: 3
  retry_backoff: 1.5
  verify: true
  cert_path: null  # Windows 환경에서 별도 ASCII 경로를 지정하려면 수정하세요.
  cert_copy_dir: null  # auto_copy_cert 사용 시 인증서를 복사할 경로 (기본값: data/certs)
  auto_copy_cert: true
  suppress_yf_warnings: true

universe:
  benchmark_symbol: "^KS11"
  default_universe: ["005930", "000660", "035420", "051910", "035720"]
  sector_preference_window_weeks: 4
  top_sector_count: 3

trend_filter:
  short_window: 20
  mid_window: 50
  long_window: 200
  min_slope: 0.0
  min_price_above_ma: 0.0

momentum_filter:
  rsi_short_window: 7
  rsi_long_window: 14
  rsi_buy_range: [30, 50]
  rsi_sell_range: [50, 70]
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

volume_filter:
  breakout_multiplier: 1.5
  pullback_multiplier: 0.7
  average_window: 20

sector_filter:
  minimum_relative_return: 0.0
  exclude_bearish: true
  sector_overrides:
    "005930": "XLK"
    "000660": "XLK"


fundamental_filter:
  max_debt_to_equity: 0.8
  min_current_ratio: 1.5
  min_cash_to_operating_expense_months: 12
  min_revenue_growth: 0.05
  min_eps_growth: 0.05

event_filter:
  include_events:
    - earnings
    - guidance
    - analyst
    - buyback
    - dividend
    - mna

multi_timeframe:
  intraday_interval: "4h"
  lookback_days: 120

risk_management:
  max_position_pct: 0.02
  atr_lookback: 14
  stop_loss_atr_multiplier: 1.5
  take_profit_atr_multiplier: 3.0
  trailing_stop_atr_multiplier: 1.0

execution:
  allow_limit_orders: true
  allow_market_orders: true
  enable_partial_take_profit: true
  partial_take_profit_levels:
    - { pct: 0.5, target_multiple: 1.5 }
    - { pct: 0.3, target_multiple: 2.0 }
  enable_trailing_stop: true
